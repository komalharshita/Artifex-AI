kind = "web"
previewPath = "/"
title = "Artifex AI: Generative AI for Automated Creative Poster Design"
description = "An Artifex AI landing page introducing a planned AI-assisted event poster design product. The current page does not include a working poster editor, AI generation, or export flow."
version = "1.0.0"
id = "artifacts/petalyx"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22450

[services.development]
run = "pnpm --filter @workspace/petalyx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petalyx", "run", "build" ]
serve = "static"
publicDir = "artifacts/petalyx/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22450"
BASE_PATH = "/"
