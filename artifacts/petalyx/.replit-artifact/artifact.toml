kind = "web"
previewPath = "/"
title = "Artifex AI — Event Poster Studio"
description = "A client-side event poster studio with editable event details, three local design variations, saved drafts, and print-resolution PNG export."
version = "1.0.0"
id = "artifacts/petalyx"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22450

[services.development]
run = "pnpm --filter @workspace/petalyx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petalyx", "run", "build" ]
serve = "static"
publicDir = "artifacts/petalyx/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22450"
BASE_PATH = "/"
